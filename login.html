<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>BlueMarket – Ingresar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #03174a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }

    /* ── WRAPPER RESPONSIVE ── */
    .screen {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0a;
    }

    .frame {
      position: relative;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #03174a;
    }

    @media (min-width: 600px) {
      .frame {
        width: 390px; height: 844px;
        border-radius: 40px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.75);
      }
    }

    /* ── FONDO: imagen difuminada ── */
    .bg-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: center top;
      filter: blur(6px) brightness(0.35);
      transform: scale(1.08);
    }

    /* ── CONTENIDO ── */
    .content {
      position: relative; z-index: 2;
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 60px 28px 44px;
    }

    /* Logo + título */
    .top {
      display: flex; flex-direction: column;
      align-items: center; gap: 14px;
      margin-top: 20px;
    }

    .logo-circle {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
      border: 1.5px solid rgba(77,184,255,0.5);
      display: flex; align-items: center; justify-content: center;
    }

    .logo-circle svg { width: 48px; height: 48px; }

    .brand { text-align: center; }
    .brand h1 {
      font-size: 32px; font-weight: 700; letter-spacing: -0.5px;
      color: #fff; line-height: 1;
    }
    .brand h1 span { color: #4db8ff; }
    .brand p {
      margin-top: 6px;
      font-size: 12px; letter-spacing: 1.8px; text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }

    /* Card de login */
    .card {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 28px 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .card h2 {
      font-size: 18px; font-weight: 600; color: #fff;
      margin-bottom: 6px;
    }
    .card p {
      font-size: 13px; color: rgba(255,255,255,0.5);
      margin-bottom: 24px; line-height: 1.5;
    }

    /* Botón Google */
    .btn-google {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 14px 20px;
      background: #fff;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600; color: #1a1a2e;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .btn-google:hover  { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(0,0,0,0.4); }
    .btn-google:active { transform: scale(0.98); }

    .btn-google svg { width: 22px; height: 22px; flex-shrink: 0; }

    /* Divisor */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
    }
    .divider hr { flex: 1; border: none; border-top: 1px solid rgba(255,255,255,0.12); }
    .divider span { font-size: 12px; color: rgba(255,255,255,0.35); }

    /* Selector de portal (oculto por defecto, aparece en primer login) */
    .portal-select { display: none; }
    .portal-select.visible { display: block; }

    .portal-select p {
      font-size: 13px; color: rgba(255,255,255,0.6);
      margin-bottom: 14px; text-align: center;
    }

    .portales {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .portal-btn {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      padding: 16px 8px;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      color: rgba(255,255,255,0.7);
      font-size: 12px; font-weight: 500; text-align: center;
    }
    .portal-btn:hover {
      border-color: #4db8ff;
      background: rgba(77,184,255,0.10);
      color: #fff;
    }
    .portal-btn.selected {
      border-color: #4db8ff;
      background: rgba(77,184,255,0.15);
      color: #fff;
    }
    .portal-btn svg { width: 28px; height: 28px; opacity: 0.85; }

    /* Botón confirmar portal */
    .btn-confirm {
      width: 100%; margin-top: 16px;
      padding: 14px;
      background: #4db8ff;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; color: #03174a;
      cursor: pointer;
      display: none;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-confirm.visible { display: block; }
    .btn-confirm:active { transform: scale(0.98); opacity: 0.9; }

    /* Estado de carga post-Google */
    .loading-state {
      display: none;
      flex-direction: column; align-items: center; gap: 12px;
      padding: 20px 0;
    }
    .loading-state.visible { display: flex; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(77,184,255,0.2);
      border-top-color: #4db8ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-state p { font-size: 14px; color: rgba(255,255,255,0.6); }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 11px; color: rgba(255,255,255,0.25);
      line-height: 1.6;
    }
    .footer a { color: rgba(77,184,255,0.6); text-decoration: none; }
  </style>
</head>

      <div class="content">

        <!-- LOGO -->
        <div class="top">
          <div class="logo-circle">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="24" r="20" stroke="#4db8ff" stroke-width="1.5" opacity="0.5"/>
              <ellipse cx="25" cy="23" rx="10" ry="6" fill="#4db8ff" opacity="0.9" transform="rotate(-20 25 23)"/>
              <path d="M15,23 Q11,17 8,13 Q13,16 15,20 Q11,23 8,30 Q13,26 15,23Z" fill="#1565C0"/>
              <circle cx="30" cy="19" r="1.8" fill="white"/>
              <circle cx="30.5" cy="18.5" r="0.7" fill="#03174a"/>
            </svg>
          </div>
          <div class="brand">
            <h1><span>Blue</span>Market</h1>
            <p>Tu pescadería digital</p>
          </div>
        </div>

        <!-- CARD LOGIN -->
        <div class="card" id="loginCard">

          <!-- Estado normal -->
          <div id="normalState">
            <h2>Bienvenido</h2>
            <p>Ingresá con tu cuenta Google para continuar. Sin contraseñas, sin complicaciones.</p>

            <button class="btn-google" onclick="handleGoogleLogin()">
              <!-- Google icon SVG -->
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              Continuar con Google
            </button>
          </div>

          <!-- Estado cargando -->
          <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <p id="loadingMsg">Verificando cuenta...</p>
          </div>

          <!-- Selector de portal (primer login) -->
          <div class="portal-select" id="portalSelect">
            <p>¿Cómo vas a usar BlueMarket?</p>
            <div class="portales">

              <button class="portal-btn" onclick="selectPortal(this,'cliente')">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4,8 L7,8 L10,22 L24,22 L27,12 L9,12" stroke="#4db8ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="12" cy="26" r="1.8" fill="#4db8ff"/>
                  <circle cx="22" cy="26" r="1.8" fill="#4db8ff"/>
                </svg>
                Soy Pescadería
              </button>

              <button class="portal-btn" onclick="selectPortal(this,'consumidor')">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="16" cy="12" r="5" stroke="#4db8ff" stroke-width="1.8"/>
                  <path d="M6,28 Q10,20 16,20 Q22,20 26,28" stroke="#4db8ff" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                Soy Cliente
              </button>

              <button class="portal-btn" onclick="selectPortal(this,'repartidor')">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="16" cy="12" r="5" stroke="#4db8ff" stroke-width="1.8"/>
                  <path d="M6,28 Q10,20 16,20 Q22,20 26,28" stroke="#4db8ff" stroke-width="1.8" stroke-linecap="round"/>
                  <circle cx="24" cy="22" r="4" fill="#03174a" stroke="#4db8ff" stroke-width="1.5"/>
                  <path d="M22,22 L23.5,23.5 L26,20" stroke="#4db8ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Soy Repartidor
              </button>

              <button class="portal-btn" onclick="selectPortal(this,'developer')">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="4" y="6" width="24" height="18" rx="3" stroke="#4db8ff" stroke-width="1.8"/>
                  <path d="M10,14 L14,18 L10,22" stroke="#4db8ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M16,22 L22,22" stroke="#4db8ff" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                Developer
              </button>

            </div>
            <button class="btn-confirm" id="btnConfirm" onclick="confirmPortal()">
              Ingresar →
            </button>
          </div>

        </div>

        <!-- FOOTER -->
        <div class="footer">
          Al continuar aceptás los <a href="#">Términos de uso</a><br>
          y la <a href="#">Política de privacidad</a>
        </div>

      </div>
    </div>
  </div>

  <script>
    let selectedPortal = null;

    function handleGoogleLogin() {
      // Simula flujo: mostrar spinner → detectar si es nuevo usuario → mostrar selector
      const normalState  = document.getElementById('normalState');
      const loadingState = document.getElementById('loadingState');
      const portalSelect = document.getElementById('portalSelect');
      const loadingMsg   = document.getElementById('loadingMsg');

      normalState.style.display = 'none';
      loadingState.classList.add('visible');

      // En producción: llamar a Supabase Auth con Google OAuth
      // supabase.auth.signInWithOAuth({ provider: 'google' })

      setTimeout(() => {
        loadingMsg.textContent = 'Bienvenido a BlueMarket 👋';
        setTimeout(() => {
          loadingState.classList.remove('visible');
          // Simula usuario nuevo → mostrar selector de portal
          // En producción: verificar si existe rol en DB
          const isNewUser = true;
          if (isNewUser) {
            portalSelect.classList.add('visible');
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 900);
      }, 1400);
    }

    function selectPortal(btn, portal) {
      document.querySelectorAll('.portal-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedPortal = portal;
      document.getElementById('btnConfirm').classList.add('visible');
    }

    function confirmPortal() {
      if (!selectedPortal) return;
      // En producción: guardar rol en Supabase DB y redirigir
      // supabase.from('profiles').upsert({ role: selectedPortal })
      const rutas = {
        cliente:    'pages/cliente/dashboard.html',
        consumidor: 'pages/consumidor/inicio.html',
        repartidor: 'pages/repartidor/inicio.html',
        developer:  'pages/developer/dashboard.html'
      };
      alert('Portal seleccionado: ' + selectedPortal + '\nEn producción redirige a: ' + rutas[selectedPortal]);
    }
  </script>
