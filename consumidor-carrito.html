<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>BlueMarket – Carrito</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg:        #03174a;
      --bg2:       #051e5c;
      --surface:   rgba(255,255,255,0.06);
      --surface2:  rgba(255,255,255,0.10);
      --border:    rgba(255,255,255,0.10);
      --blue:      #4db8ff;
      --blue-dim:  rgba(77,184,255,0.15);
      --green:     #2ecc71;
      --green-dim: rgba(46,204,113,0.15);
      --orange:    #f39c12;
      --red:       #e74c3c;
      --text:      #ffffff;
      --text2:     rgba(255,255,255,0.55);
      --text3:     rgba(255,255,255,0.28);
      --nav-h:     68px;
    }
    html, body { width:100%; height:100%; background:#0a0a0a;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; }
    .screen { position:fixed;inset:0;display:flex;align-items:center;justify-content:center; }
    .frame  { position:relative;width:100%;height:100%;background:var(--bg);
      overflow:hidden;display:flex;flex-direction:column; }
    @media(min-width:600px){
      .frame{width:390px;height:844px;border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,.75);}
    }

    /* TOPBAR */
    .topbar {
      flex-shrink:0;
      display:flex;align-items:center;gap:12px;
      padding:16px 20px 14px;
      border-bottom:1px solid var(--border);
      background:rgba(3,23,74,.97);
      backdrop-filter:blur(10px);
    }
    .back-btn {
      width:36px;height:36px;border-radius:10px;
      background:var(--surface);border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;flex-shrink:0;
    }
    .back-btn svg{width:18px;height:18px;stroke:var(--text2);}
    .topbar h1{font-size:17px;font-weight:700;color:var(--text);flex:1;}
    .item-count{font-size:12px;color:var(--text2);}

    /* CONTENT */
    .content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 0;}
    .content::-webkit-scrollbar{display:none;}

    /* ITEMS */
    .cart-items{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}

    .cart-item{
      background:var(--surface);border:1px solid var(--border);border-radius:16px;
      padding:14px;display:flex;align-items:center;gap:12px;
    }
    .item-emoji{font-size:32px;width:52px;height:52px;
      background:linear-gradient(135deg,#051e5c,#0a3a7a);
      border-radius:12px;display:flex;align-items:center;justify-content:center;
      flex-shrink:0;}
    .item-info{flex:1;min-width:0;}
    .item-name{font-size:14px;font-weight:600;color:var(--text);}
    .item-unit{font-size:11px;color:var(--text3);margin-top:2px;}
    .item-price{font-size:13px;font-weight:700;color:var(--blue);margin-top:6px;}

    .qty-ctrl{display:flex;align-items:center;gap:0;flex-shrink:0;}
    .qty-btn{
      width:30px;height:30px;border-radius:8px;border:none;
      background:var(--surface2);color:var(--text);font-size:16px;font-weight:700;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:background .15s;
    }
    .qty-btn:hover{background:var(--blue-dim);}
    .qty-btn.minus{border-radius:8px 0 0 8px;}
    .qty-btn.plus {border-radius:0 8px 8px 0;}
    .qty-val{
      width:32px;text-align:center;font-size:14px;font-weight:700;color:var(--text);
      background:var(--surface);border-top:1px solid var(--border);
      border-bottom:1px solid var(--border);height:30px;
      display:flex;align-items:center;justify-content:center;
    }

    /* NOTA */
    .nota-section{margin-bottom:20px;}
    .nota-section label{font-size:12px;color:var(--text2);margin-bottom:6px;display:block;}
    .nota-input{
      width:100%;background:var(--surface);border:1px solid var(--border);
      border-radius:12px;padding:10px 14px;color:var(--text);font-size:13px;
      resize:none;outline:none;font-family:inherit;
    }
    .nota-input::placeholder{color:var(--text3);}
    .nota-input:focus{border-color:var(--blue);}

    /* RESUMEN */
    .resumen{
      background:var(--surface);border:1px solid var(--border);
      border-radius:16px;padding:16px;margin-bottom:20px;
    }
    .resumen-row{
      display:flex;align-items:center;justify-content:space-between;
      font-size:13px;color:var(--text2);padding:5px 0;
    }
    .resumen-row.total{
      border-top:1px solid var(--border);margin-top:6px;padding-top:12px;
      font-size:16px;font-weight:700;color:var(--text);
    }
    .resumen-row.total span:last-child{color:var(--green);font-size:18px;}

    /* FOOTER FIJO */
    .footer-bar{
      flex-shrink:0;
      padding:14px 16px 20px;
      background:rgba(3,23,74,.97);
      border-top:1px solid var(--border);
      backdrop-filter:blur(12px);
    }
    .btn-checkout{
      width:100%;padding:15px;border:none;border-radius:14px;
      background:var(--blue);color:#03174a;
      font-size:16px;font-weight:800;cursor:pointer;
      transition:transform .15s,opacity .2s;
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn-checkout:active{transform:scale(.98);opacity:.9;}
    .btn-checkout svg{width:20px;height:20px;stroke:#03174a;}
  </style>
</head>
<body>
<div class="screen">
  <div class="frame">

    <div class="topbar">
      <div class="back-btn" onclick="goBack()">
        <svg fill="none" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1>Mi carrito</h1>
      <span class="item-count" id="itemCount">3 productos</span>
    </div>

    <div class="content">
      <div class="cart-items" id="cartItems">

        <div class="cart-item" data-price="1800" data-qty="2">
          <div class="item-emoji">🐟</div>
          <div class="item-info">
            <div class="item-name">Merluza fresca</div>
            <div class="item-unit">$1.800 / kg</div>
            <div class="item-price" id="price0">$3.600</div>
          </div>
          <div class="qty-ctrl">
            <button class="qty-btn minus" onclick="changeQty(this,-1)">−</button>
            <div class="qty-val">2</div>
            <button class="qty-btn plus"  onclick="changeQty(this,+1)">+</button>
          </div>
        </div>

        <div class="cart-item" data-price="3200" data-qty="1">
          <div class="item-emoji">🦐</div>
          <div class="item-info">
            <div class="item-name">Langostinos</div>
            <div class="item-unit">$3.200 / kg</div>
            <div class="item-price" id="price1">$3.200</div>
          </div>
          <div class="qty-ctrl">
            <button class="qty-btn minus" onclick="changeQty(this,-1)">−</button>
            <div class="qty-val">1</div>
            <button class="qty-btn plus"  onclick="changeQty(this,+1)">+</button>
          </div>
        </div>

        <div class="cart-item" data-price="4500" data-qty="1">
          <div class="item-emoji">🍣</div>
          <div class="item-info">
            <div class="item-name">Salmón rosado</div>
            <div class="item-unit">$4.500 / kg</div>
            <div class="item-price" id="price2">$4.500</div>
          </div>
          <div class="qty-ctrl">
            <button class="qty-btn minus" onclick="changeQty(this,-1)">−</button>
            <div class="qty-val">1</div>
            <button class="qty-btn plus"  onclick="changeQty(this,+1)">+</button>
          </div>
        </div>

      </div>

      <!-- NOTA -->
      <div class="nota-section">
        <label>Nota para la pescadería (opcional)</label>
        <textarea class="nota-input" rows="2" placeholder="Ej: limpiar el pescado, sin espinas..."></textarea>
      </div>

      <!-- RESUMEN -->
      <div class="resumen">
        <div class="resumen-row"><span>Subtotal</span><span id="subtotal">$11.300</span></div>
        <div class="resumen-row"><span>Envío</span><span id="envio">$500</span></div>
        <div class="resumen-row"><span>Descuento</span><span style="color:var(--green)" id="descuento">− $0</span></div>
        <div class="resumen-row total"><span>Total</span><span id="total">$11.800</span></div>
      </div>
    </div>

    <div class="footer-bar">
      <button class="btn-checkout" onclick="goCheckout()">
        <svg fill="none" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Ir a confirmar pedido
      </button>
    </div>

  </div>
</div>
<script>
  function fmt(n){return '$'+n.toLocaleString('es-AR');}
  function recalc(){
    const items=document.querySelectorAll('.cart-item');
    let sub=0;
    items.forEach((item,i)=>{
      const p=parseInt(item.dataset.price);
      const q=parseInt(item.dataset.qty);
      sub+=p*q;
      item.querySelector('.item-price').textContent=fmt(p*q);
    });
    const envio=sub>10000?0:500;
    document.getElementById('subtotal').textContent=fmt(sub);
    document.getElementById('envio').textContent=envio===0?'Gratis':fmt(envio);
    document.getElementById('total').textContent=fmt(sub+envio);
    document.getElementById('itemCount').textContent=
      document.querySelectorAll('.cart-item').length+' productos';
  }
  function changeQty(btn,delta){
    const item=btn.closest('.cart-item');
    let q=parseInt(item.dataset.qty)+delta;
    if(q<1){
      if(confirm('¿Eliminar este producto?')){item.remove();recalc();}
      return;
    }
    item.dataset.qty=q;
    item.querySelector('.qty-val').textContent=q;
    recalc();
  }
  function goBack(){history.back();}
  function goCheckout(){window.location.href='consumidor-checkout.html';}
  recalc();
</script>
</body>
</html>
